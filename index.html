<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR/Barcode Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }
        #scanner-container {
            width: 100%;
            max-width: 500px;
            position: relative;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid red;
        }
        #controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-size: 1.1em;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Сканер штрих-кодов и QR-кодов</h1>
        <div id="scanner-container">
            <video id="video" width="500" height="375" playsinline></video>
        </div>
        <div id="controls">
            <button id="switchCameraButton" disabled>Переключить камеру</button>
        </div>
        <div id="result">Инициализация...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const videoElement = document.getElementById('video');
        const switchCameraButton = document.getElementById('switchCameraButton');
        const resultElement = document.getElementById('result');
        let codeReader;
        let stream;
        let videoDevices = [];
        let currentDeviceId = null;
        let currentDeviceIndex = -1;

        function stopStreaming() {
            if (stream) {
                console.log('Остановка потока камеры');
                stream.getTracks().forEach(track => track.stop());
                stream = null; // Очищаем ссылку
            }
            if (codeReader) {
                console.log('Сброс сканера');
                codeReader.reset();
                codeReader = null; // Очищаем ссылку
            }
            videoElement.srcObject = null; // Очищаем srcObject видеоэлемента
        }

        async function startScanning(constraints) {
            stopStreaming(); // Останавливаем предыдущий поток, если есть

            resultElement.textContent = 'Запрос доступа к камере...';

            try {
                // Используем переданные ограничения (например, facingMode)
                stream = await navigator.mediaDevices.getUserMedia(constraints);

                resultElement.textContent = 'Доступ к камере получен, подготовка видеопотока...';

                // Инициализируем сканер, если он еще не инициализирован
                if (!codeReader) {
                    codeReader = new ZXing.BrowserMultiFormatReader();
                }

                // Отображаем видеопоток
                videoElement.srcObject = stream;

                // Ждем загрузки метаданных видео
                videoElement.onloadedmetadata = () => {
                    resultElement.textContent = 'Метаданные видео загружены, запуск воспроизведения...';
                    videoElement.play();

                    // Отображаем, какая камера используется (если возможно определить facingMode)
                    const settings = stream.getVideoTracks()[0].getSettings();
                    let cameraInfo = 'Камера';
                    if (settings.facingMode) {
                         cameraInfo = settings.facingMode === 'user' ? 'Фронтальная камера' : 'Задняя камера';
                    } else if (settings.label) {
                        cameraInfo = settings.label;
                    }

                    resultElement.textContent = `Наведите камеру на штрих-код или QR-код (${cameraInfo})`;

                    // Начинаем декодирование видеопотока
                    codeReader.decodeFromStream(stream, videoElement, (result, error) => {
                        if (result) {
                            console.log('Отсканировано:', result.getText());
                            resultElement.textContent = `Отсканировано: ${result.getText()}`;
                            // Отправляем данные обратно в бот
                            tg.sendData(result.getText());
                            // Закрываем веб-приложение Telegram после первого успешного сканирования
                            tg.close();
                        }
                        // Не показываем alert на каждую ошибку сканирования (например, NotFoundException)
                        if (error && !(error instanceof ZXing.NotFoundException)) {
                            console.error(error);
                        }
                    });
                };

            } catch (error) {
                console.error('Ошибка при доступе к камере:', error);
                resultElement.textContent = `Ошибка при доступе к камере: ${error.name} - ${error.message}`;
                // В случае ошибки, window.onload попытается использовать другой вариант
                throw error; // Перебрасываем ошибку, чтобы window.onload мог ее поймать
            }
        }

        // Получаем доступ к камере при загрузке: сначала задняя, потом фронтальная, потом любая
        window.onload = async () => {
            resultElement.textContent = 'Поиск доступных камер...';
            // Отключаем кнопку переключения, так как пока не будем перечислять все устройства
            switchCameraButton.disabled = true; 

            try {
                // 1. Пробуем заднюю камеру
                console.log('Попытка запуска задней камеры...');
                await startScanning({ video: { facingMode: 'environment' } });

            } catch (envError) {
                console.error('Не удалось запустить заднюю камеру:', envError);
                resultElement.textContent = 'Задняя камера не найдена или недоступна, пробуем фронтальную...';

                try {
                    // 2. Пробуем фронтальную камеру
                     console.log('Попытка запуска фронтальной камеры...');
                    await startScanning({ video: { facingMode: 'user' } });

                } catch (userError) {
                    console.error('Не удалось запустить фронтальную камеру:', userError);
                    resultElement.textContent = 'Фронтальная камера не найдена или недоступна, пробуем любую доступную...';

                    try {
                         // 3. Пробуем любую доступную камеру
                         console.log('Попытка запуска любой доступной камеры...');
                        await startScanning({ video: true });

                    } catch (anyError) {
                        console.error('Не удалось получить доступ ни к одной камере:', anyError);
                        resultElement.textContent = `Ошибка: ${anyError.name} - ${anyError.message}. Камера недоступна.`;
                        tg.showAlert(`Не удалось получить доступ к камере: ${anyError.message}. Пожалуйста, проверьте разрешения.`);
                    }
                }
            }
        };

        // Обработчик нажатия кнопки переключения камеры - временно отключен
        // switchCameraButton.addEventListener('click', () => { ... });

        // Привязываем остановку потока к событиям закрытия веб-приложения
        function setupCleanupEvents() {
            tg.onEvent('mainButtonBackPressed', stopStreaming);
            tg.onEvent('viewportChanged', stopStreaming);
            window.addEventListener('beforeunload', stopStreaming);
            tg.onEvent('popupClosed', stopStreaming);
        }

        setupCleanupEvents();

    </script>
</body>
</html>
