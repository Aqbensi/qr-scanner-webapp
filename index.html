<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR/Barcode Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }
        #scanner-container {
            width: 100%;
            max-width: 500px;
            position: relative;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid red;
        }
        #controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-size: 1.1em;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Сканер штрих-кодов и QR-кодов</h1>
        <div id="scanner-container">
            <video id="video" width="500" height="375" playsinline></video>
        </div>
        <div id="controls">
            <button id="switchCameraButton" disabled>Переключить камеру</button>
        </div>
        <div id="result">Инициализация...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const videoElement = document.getElementById('video');
        const switchCameraButton = document.getElementById('switchCameraButton');
        const resultElement = document.getElementById('result');
        let codeReader;
        let stream;
        let videoDevices = [];
        let currentDeviceId = null;
        let currentDeviceIndex = -1;

        function stopStreaming() {
            if (stream) {
                console.log('Остановка потока камеры');
                stream.getTracks().forEach(track => track.stop());
                stream = null; // Очищаем ссылку
            }
            if (codeReader) {
                console.log('Сброс сканера');
                codeReader.reset();
                codeReader = null; // Очищаем ссылку
            }
            videoElement.srcObject = null; // Очищаем srcObject видеоэлемента
        }

        async function startScanning(deviceId) {
            stopStreaming(); // Останавливаем предыдущий поток, если есть

            resultElement.textContent = 'Запрос доступа к камере...';

            try {
                // Запрашиваем доступ к камере по deviceId или используем facingMode
                const constraints = {
                    video: {
                        deviceId: deviceId ? { exact: deviceId } : undefined
                    }
                };

                // Если deviceId не указан (первый запуск), пробуем сначала 'user', потом 'environment'
                if (!deviceId) {
                    constraints.video.facingMode = 'user'; // Сначала фронтальная
                } else {
                    // Если deviceId указан, facingMode не используем
                    delete constraints.video.facingMode;
                }

                stream = await navigator.mediaDevices.getUserMedia(constraints);

                resultElement.textContent = 'Доступ к камере получен, подготовка видеопотока...';

                // Инициализируем сканер, если он еще не инициализирован
                if (!codeReader) {
                    codeReader = new ZXing.BrowserMultiFormatReader();
                }

                // Отображаем видеопоток
                videoElement.srcObject = stream;
                
                // Ждем загрузки метаданных видео
                videoElement.onloadedmetadata = () => {
                    resultElement.textContent = 'Метаданные видео загружены, запуск воспроизведения...';
                    videoElement.play();

                    // Находим имя текущей камеры для отображения
                    const activeDevice = videoDevices.find(dev => dev.deviceId === (deviceId || stream.getVideoTracks()[0].getSettings().deviceId));
                    const cameraName = activeDevice ? (activeDevice.label || `Камера ${currentDeviceIndex + 1}`) : 'Неизвестная камера';

                    resultElement.textContent = `Наведите камеру на штрих-код или QR-код (${cameraName})`;

                    // Начинаем декодирование видеопотока
                    codeReader.decodeFromStream(stream, videoElement, (result, error) => {
                        if (result) {
                            console.log('Отсканировано:', result.getText());
                            resultElement.textContent = `Отсканировано: ${result.getText()}`;
                            // Отправляем данные обратно в бот
                            tg.sendData(result.getText());
                            // Закрываем веб-приложение Telegram после первого успешного сканирования
                            tg.close();
                        }
                        // Не показываем alert на каждую ошибку сканирования (например, NotFoundException)
                        if (error && !(error instanceof ZXing.NotFoundException)) {
                            console.error(error);
                        }
                    });
                };

            } catch (error) {
                console.error('Ошибка при доступе к камере или запуске сканера:', error);
                resultElement.textContent = `Ошибка: ${error.name} - ${error.message}`;
                tg.showAlert(`Не удалось получить доступ к камере: ${error.message}. Попробуйте использовать другое устройство или обновить Telegram.`);

                // Если первая попытка (с facingMode или deviceId) не удалась, попробуем просто запросить любую камеру как fallback
                if (!deviceId || error.name === 'OverconstrainedError' || error.name === 'NotFoundError') {
                    // Если ошибка при запросе 'environment' или конкретного deviceId, или просто первый запуск не удался
                    // и мы еще не пробовали общий запрос
                    if (!deviceId && error.name === 'OverconstrainedError' && error.message.includes('facingMode')) {
                        // Специфическая ошибка для facingMode, пробуем общую
                        resultElement.textContent = 'Ошибка с facingMode, пробуем любую доступную...';
                    } else if (deviceId && (error.name === 'OverconstrainedError' || error.name === 'NotFoundError')) {
                        // Ошибка с конкретным deviceId
                        resultElement.textContent = 'Ошибка с выбранной камерой, пробуем любую доступную...';
                    } else {
                        // Другая ошибка при первом запросе или при запросе по deviceId
                        resultElement.textContent = `Не удалось получить доступ к камере. Ошибка: ${error.name}. Пробуем другую камеру...`;
                    }

                    try {
                        // Пробуем запросить любую камеру без конкретных ограничений
                        navigator.mediaDevices.getUserMedia({ video: true }).then(fallbackStream => {
                            stream = fallbackStream;
                            // Повторяем логику отображения и сканирования для fallback
                            // Находим deviceId fallback камеры
                            const fallbackDeviceId = stream.getVideoTracks()[0].getSettings().deviceId;
                            const fallbackDevice = videoDevices.find(dev => dev.deviceId === fallbackDeviceId);
                            const fallbackCameraName = fallbackDevice ? (fallbackDevice.label || 'Камера (fallback)') : 'Неизвестная камера (fallback)';

                            videoElement.srcObject = stream;
                            videoElement.onloadedmetadata = () => {
                                resultElement.textContent = `Камера по умолчанию доступна, запуск сканирования... (${fallbackCameraName})`;
                                videoElement.play();
                                resultElement.textContent = `Наведите камеру на штрих-код или QR-код (${fallbackCameraName})`;
                                // Инициализируем сканер, если нужно
                                if (!codeReader) {
                                    codeReader = new ZXing.BrowserMultiFormatReader();
                                }
                                codeReader.decodeFromStream(stream, videoElement, (result, error) => {
                                    if (result) {
                                        console.log('Отсканировано:', result.getText());
                                        resultElement.textContent = `Отсканировано: ${result.getText()}`;
                                        tg.sendData(result.getText());
                                        tg.close();
                                    }
                                    if (error && !(error instanceof ZXing.NotFoundException)) {
                                        console.error(error);
                                    }
                                });
                            };
                            // Обновляем currentDeviceId и currentDeviceIndex для fallback камеры
                            currentDeviceId = fallbackDeviceId;
                            currentDeviceIndex = videoDevices.findIndex(dev => dev.deviceId === fallbackDeviceId);

                            // Включаем кнопку переключения, если после fallback найдено несколько устройств
                            if (videoDevices.length > 1) {
                                switchCameraButton.disabled = false;
                            } else {
                                switchCameraButton.disabled = true;
                            }

                        }).catch(fallbackError => {
                            console.error('Ошибка при попытке получить любую камеру:', fallbackError);
                            resultElement.textContent = `Ошибка: ${fallbackError.name} - ${fallbackError.message}. Камера недоступна.`;
                            tg.showAlert(`Не удалось получить доступ даже к камере по умолчанию: ${fallbackError.message}`);
                            switchCameraButton.disabled = true; // Отключаем кнопку, если нет доступных камер
                        });
                    } catch (anotherError) {
                        console.error('Непредвиденная ошибка при попытке fallback:', anotherError);
                        resultElement.textContent = `Непредвиденная ошибка при fallback: ${anotherError.name} - ${anotherError.message}. Камера недоступна.`;
                        tg.showAlert(`Непредвиденная ошибка при fallback: ${anotherError.message}`);
                        switchCameraButton.disabled = true; // Отключаем кнопку
                    }
                } else {
                    // Если ошибка не связана с facingMode или deviceId, просто выводим alert и отключаем кнопку
                    tg.showAlert(`Не удалось получить доступ к камере: ${error.message}. Попробуйте использовать другое устройство или обновить Telegram.`);
                    switchCameraButton.disabled = true;
                }
            }
        }

        // Получаем список камер при загрузке и запускаем сканирование с первой (фронтальной по возможности)
        window.onload = async () => {
            resultElement.textContent = 'Поиск доступных камер...';
            try {
                // Запрашиваем разрешение до перечисления, это может помочь получить labels
                await navigator.mediaDevices.getUserMedia({ video: true, audio: false });

                const devices = await navigator.mediaDevices.enumerateDevices();
                videoDevices = devices.filter(device => device.kind === 'videoinput');
                console.log('Найденные видеоустройства:', videoDevices);

                if (videoDevices.length === 0) {
                    resultElement.textContent = 'Камера не найдена на вашем устройстве.';
                    tg.showAlert('Камера не найдена на вашем устройстве.');
                    switchCameraButton.disabled = true;
                    return;
                }

                // Определяем, с какой камеры начать:
                // 1. Пробуем найти камеру с facingMode = 'user' (фронтальная)
                const userCamera = videoDevices.find(device => device.getCapabilities().facingMode && device.getCapabilities().facingMode.includes('user'));

                let deviceToStartId = null;

                if (userCamera) {
                    deviceToStartId = userCamera.deviceId;
                    currentDeviceIndex = videoDevices.findIndex(dev => dev.deviceId === deviceToStartId);
                    console.log('Найдена фронтальная камера, начинаем с нее:', userCamera);
                } else {
                    // 2. Если 'user' не найдена, пробуем найти 'environment' (задняя)
                    const environmentCamera = videoDevices.find(device => device.getCapabilities().facingMode && device.getCapabilities().facingMode.includes('environment'));

                    if (environmentCamera) {
                        deviceToStartId = environmentCamera.deviceId;
                        currentDeviceIndex = videoDevices.findIndex(dev => dev.deviceId === deviceToStartId);
                        console.log('Фронтальная камера не найдена, найдена задняя, начинаем с нее:', environmentCamera);
                    } else {
                        // 3. Если ни user, ни environment не найдены/поддерживаются, берем первую попавшуюся
                        deviceToStartId = videoDevices[0].deviceId;
                        currentDeviceIndex = 0;
                        console.log('Facing modes не найдены, начинаем с первой камеры:', videoDevices[0]);
                    }
                }
                currentDeviceId = deviceToStartId;

                startScanning(currentDeviceId);

                // Если камер больше одной, включаем кнопку переключения
                if (videoDevices.length > 1) {
                    switchCameraButton.disabled = false;
                } else {
                    switchCameraButton.disabled = true;
                }

            } catch (error) {
                console.error('Ошибка при перечислении устройств или первом запросе:', error);
                resultElement.textContent = `Ошибка при поиске или первом запросе камеры: ${error.name} - ${error.message}`;
                tg.showAlert(`Не удалось получить список камер или первую камеру: ${error.message}`);
                switchCameraButton.disabled = true;
            }
        };

        // Обработчик нажатия кнопки переключения камеры
        switchCameraButton.addEventListener('click', () => {
            if (videoDevices.length <= 1) {
                console.log('Кнопка переключения нажата, но доступна только одна камера.');
                return;
            }

            // Определяем индекс следующей камеры
            const nextIndex = (currentDeviceIndex + 1) % videoDevices.length;
            const nextDeviceId = videoDevices[nextIndex].deviceId;

            console.log('Попытка переключить на камеру:', videoDevices[nextIndex].label || nextDeviceId);

            // Запускаем сканирование с новой камерой
            startScanning(nextDeviceId).then(() => {
                currentDeviceIndex = nextIndex;
                currentDeviceId = nextDeviceId;
                console.log('Успешно переключено на камеру:', videoDevices[currentDeviceIndex].label || currentDeviceId);
            }).catch(error => {
                console.error('Ошибка при переключении камеры:', error);
                resultElement.textContent = `Ошибка при переключении камеры: ${error.name} - ${error.message}`;
                tg.showAlert(`Не удалось переключить камеру: ${error.message}`);
            });
        });

        // Привязываем остановку потока к событиям закрытия веб-приложения
        function setupCleanupEvents() {
            tg.onEvent('mainButtonBackPressed', stopStreaming);
            tg.onEvent('viewportChanged', stopStreaming);
            window.addEventListener('beforeunload', stopStreaming);
            tg.onEvent('popupClosed', stopStreaming);
        }

        setupCleanupEvents();

    </script>
</body>
</html>
