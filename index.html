<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR/Barcode Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }
        #scanner-container {
            width: 100%;
            max-width: 500px;
            position: relative;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid red;
        }
        #controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-size: 1.1em;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Сканер штрих-кодов и QR-кодов</h1>
        <div id="scanner-container">
            <video id="video" width="500" height="375" playsinline></video>
        </div>
        <div id="controls">
            <button id="switchCameraButton" disabled>Переключить камеру</button>
        </div>
        <div id="result">Инициализация...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const videoElement = document.getElementById('video');
        const switchCameraButton = document.getElementById('switchCameraButton');
        const resultElement = document.getElementById('result');
        let codeReader;
        let stream;
        let videoDevices = [];
        let currentDeviceId = null;
        let currentDeviceIndex = -1;

        function stopStreaming() {
            if (stream) {
                console.log('Остановка потока камеры');
                stream.getTracks().forEach(track => track.stop());
                stream = null; // Очищаем ссылку
            }
            if (codeReader) {
                console.log('Сброс сканера');
                codeReader.reset();
                codeReader = null; // Очищаем ссылку
            }
            videoElement.srcObject = null; // Очищаем srcObject видеоэлемента
        }

        async function startScanning() {
            stopStreaming(); // Останавливаем предыдущий поток, если есть

            console.log('Начало функции startScanning');
            resultElement.textContent = 'Запрос доступа к камере...';

            try {
                console.log('Вызов navigator.mediaDevices.getUserMedia({ video: true })');
                // Запрос доступа к любой доступной видеокамере
                stream = await navigator.mediaDevices.getUserMedia({ video: true });

                console.log('Доступ к камере получен');
                resultElement.textContent = 'Доступ к камере получен, подготовка видеопотока...';

                // Инициализируем сканер, если он еще не инициализирован
                if (!codeReader) {
                    console.log('Инициализация ZXing.BrowserMultiFormatReader');
                    codeReader = new ZXing.BrowserMultiFormatReader();
                }

                // Отображаем видеопоток
                console.log('Установка videoElement.srcObject');
                videoElement.srcObject = stream;

                // Ждем загрузки данных видео или готовности к воспроизведению
                videoElement.addEventListener('loadeddata', () => {
                    console.log('Данные видео загружены');
                    videoElement.play();

                    // Получаем информацию о камере (если доступно)
                    const settings = stream.getVideoTracks()[0].getSettings();
                    let cameraInfo = 'Камера';
                    if (settings.label) {
                         cameraInfo = settings.label;
                    } else if (settings.facingMode) {
                         cameraInfo = settings.facingMode === 'user' ? 'Фронтальная камера' : 'Задняя камера';
                    }

                    console.log(`Видео воспроизводится. Используется: ${cameraInfo}`);
                    resultElement.textContent = `Наведите камеру на штрих-код или QR-код (${cameraInfo})`;

                    // Начинаем декодирование видеопотока
                    console.log('Запуск декодирования из видеопотока');
                    codeReader.decodeFromStream(stream, videoElement, (result, error) => {
                        if (result) {
                            console.log('Отсканировано успешно:', result.getText());
                            resultElement.textContent = `Отсканировано: ${result.getText()}`;
                            // Отправляем данные обратно в бот
                            tg.sendData(result.getText());
                            // Закрываем веб-приложение Telegram после первого успешного сканирования
                            tg.close();
                        }
                        // Не показываем alert на каждую ошибку сканирования (например, NotFoundException)
                        if (error && !(error instanceof ZXing.NotFoundException)) {
                            console.error('Ошибка сканирования:', error);
                        }
                    });
                }, { once: true }); // Обработчик выполнится только один раз

                 videoElement.onerror = (event) => {
                     console.error('Ошибка видеоэлемента:', event);
                     resultElement.textContent = 'Ошибка видеопотока.';
                 };


            } catch (error) {
                console.error('Ошибка при доступе к камере:', error);
                resultElement.textContent = `Ошибка при доступе к камере: ${error.name} - ${error.message}`;
                tg.showAlert(`Не удалось получить доступ к камере: ${error.message}. Пожалуйста, проверьте разрешения.`);
                // Временно отключаем кнопку при ошибке, т.к. переключение сейчас не реализовано
                 switchCameraButton.disabled = true; 
            }
             console.log('Конец функции startScanning');
        }

        // Запускаем сканирование при загрузке страницы
        window.onload = async () => {
             console.log('Начало window.onload');
            resultElement.textContent = 'Инициализация...';
             // Временно отключаем кнопку переключения
            switchCameraButton.disabled = true; 
            videoDevices = []; // Очищаем список устройств, т.к. не используем перечисление пока
            startScanning();
             console.log('Конец window.onload');
        };

        // Обработчик нажатия кнопки переключения камеры - временно отключен
        // switchCameraButton.addEventListener('click', () => { ... });

        // Привязываем остановку потока к событиям закрытия веб-приложения
        function setupCleanupEvents() {
             console.log('Настройка обработчиков cleanup событий');
            tg.onEvent('mainButtonBackPressed', stopStreaming);
            tg.onEvent('viewportChanged', stopStreaming);
            window.addEventListener('beforeunload', stopStreaming);
            tg.onEvent('popupClosed', stopStreaming);
        }

        setupCleanupEvents();

    </script>
</body>
</html>
