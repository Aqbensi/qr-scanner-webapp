<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@telegram-apps/sdk@3.0.0/dist/index.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 0;
        }
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>QR Scanner</h1>
        <button id="scanButton">Сканировать QR-код</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById('scanButton').addEventListener('click', async () => {
            console.log('Кнопка сканирования нажата');
            try {
                // Добавляем небольшую задержку
                await new Promise(resolve => setTimeout(resolve, 100));

                console.log('Проверка доступности qrScanner:', window.qrScanner);
                console.log('Проверка доступности qrScanner.open:', window.qrScanner ? window.qrScanner.open : 'undefined');
                console.log('Проверка доступности qrScanner.open.isAvailable:', window.qrScanner && window.qrScanner.open ? window.qrScanner.open.isAvailable : 'undefined');

                if (window.qrScanner && window.qrScanner.open && window.qrScanner.open.isAvailable && window.qrScanner.open.isAvailable()) {
                    console.log('QR-сканер доступен, открываем...');
                    const promise = window.qrScanner.open({
                        text: 'Наведите камеру на QR-код',
                        onCaptured(qr) {
                            console.log('QR-код отсканирован:', qr);
                            // Отправляем данные обратно в бот
                            tg.sendData(qr);
                            // Закрываем веб-приложение Telegram после отправки данных
                            tg.close();
                        }
                    });
                    await promise; // Ожидаем закрытия сканера
                    console.log('Сканер закрыт');
                } else {
                    console.error('QR-сканер недоступен или не инициализирован');
                    tg.showAlert('QR-сканер недоступен или не инициализирован на вашем устройстве');
                }
            } catch (error) {
                console.error('Ошибка при открытии QR-сканера:', error);
                tg.showAlert('Произошла ошибка при открытии QR-сканера');
            }
        });
    </script>
</body>
</html>
