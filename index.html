<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер штрих-кодов и QR-кодов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, white);
            color: var(--tg-theme-text-color, black);
        }
        #app {
            max-width: 100%;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: var(--tg-theme-text-color, black);
            margin-bottom: 20px;
        }
        #status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
        }
        #version-info {
            margin-top: 20px;
            font-size: 0.8em;
            color: var(--tg-theme-hint-color, #666);
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>Сканер штрих-кодов и QR-кодов</h1>
        <div id="status">Нажмите кнопку "Сканировать" для начала работы</div>
        <div id="version-info">Версия: 0.04</div>
    </div>

    <script>
        const app = {
            data() {
                return {
                    is_telegram_client: false,
                    is_telegram_api_updated: false,
                    code: null,
                    is_url: false,
                    url: null,
                    status: 'Нажмите кнопку "Сканировать" для начала работы'
                }
            },
            created() {
                // Инициализация Telegram Web App
                this.TWA = window.Telegram.WebApp;
                
                // Настройка кнопки
                this.TWA.MainButton.setText("Сканировать");
                this.TWA.onEvent('qrTextReceived', this.processQRCode);
                this.TWA.onEvent('mainButtonClicked', this.showQRScanner);

                // Проверка версии API
                this.is_telegram_api_updated = this.TWA.isVersionAtLeast('6.4');
                this.is_telegram_client = this.TWA.platform !== "unknown";

                if (this.is_telegram_client && this.is_telegram_api_updated) {
                    this.TWA.MainButton.show();
                } else {
                    this.status = 'Пожалуйста, обновите Telegram для использования приложения!';
                }
            },
            mounted() {
                this.TWA.ready();
            },
            methods: {
                showQRScanner() {
                    const params = { text: "" };
                    this.TWA.showScanQrPopup(params);
                    this.status = 'Наведите камеру на штрих-код или QR-код';
                },
                processQRCode(data) {
                    this.code = data.data;
                    this.status = `Отсканировано: ${this.code}`;
                    
                    // Проверка на URL
                    try {
                        new URL(this.code);
                        this.is_url = true;
                        this.url = this.code;
                    } catch {
                        this.is_url = false;
                        this.url = null;
                    }

                    // Вибрация при успешном сканировании
                    this.TWA.HapticFeedback.impactOccurred("heavy");
                    this.TWA.closeScanQrPopup();
                }
            }
        };

        // Создание и монтирование приложения
        const { createApp } = Vue;
        createApp(app).mount('#app');
    </script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</body>
</html>
