<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR/Barcode Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }
        #scanner-container {
            width: 100%;
            max-width: 500px;
            position: relative;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        #result {
            margin-top: 20px;
            font-size: 1.1em;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Сканер штрих-кодов и QR-кодов</h1>
        <div id="scanner-container">
            <video id="video" width="500" height="375"></video>
        </div>
        <div id="result">Запуск сканера...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const videoElement = document.getElementById('video');
        const resultElement = document.getElementById('result');
        let codeReader;
        let stream;

        async function startScanning() {
            resultElement.textContent = 'Запуск камеры...';
            try {
                // Запрашиваем доступ к основной (средовой) камере
                // Если не получится, попробуем просто запросить любое видеоустройство
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment'
                    }
                });

                // Если получили поток, инициализируем сканер
                codeReader = new ZXing.BrowserMultiFormatReader();

                // Отображаем видеопоток
                videoElement.srcObject = stream;
                // Убедимся, что видео полностью загружено перед началом сканирования
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    resultElement.textContent = 'Наведите камеру на штрих-код или QR-код';
                    // Начинаем декодирование видеопотока
                    codeReader.decodeFromStream(stream, videoElement, (result, error) => {
                        if (result) {
                            console.log('Отсканировано:', result.getText());
                            resultElement.textContent = `Отсканировано: ${result.getText()}`;
                            // Отправляем данные обратно в бот
                            tg.sendData(result.getText());
                            // Можно закрыть веб-приложение после первого успешного сканирования
                            tg.close();
                        }
                        // Не показываем alert на каждую ошибку сканирования (например, NotFoundException)
                        if (error && !(error instanceof ZXing.NotFoundException)) {
                            console.error(error);
                        }
                    });
                };

            } catch (error) {
                console.error('Ошибка при доступе к камере или запуске сканера:', error);
                resultElement.textContent = `Ошибка: ${error.name} - ${error.message}`;
                tg.showAlert(`Не удалось получить доступ к камере: ${error.message}`);
                // Если ошибка из-за facingMode, можно попробовать запросить любую камеру
                if (error.name === 'OverconstrainedError' || error.name === 'NotFoundError') {
                    try {
                        stream = await navigator.mediaDevices.getUserMedia({ video: true });
                        // Повторяем логику отображения и сканирования для fallback
                        videoElement.srcObject = stream;
                        videoElement.onloadedmetadata = () => {
                            videoElement.play();
                            resultElement.textContent = 'Наведите камеру на штрих-код или QR-код (используется камера по умолчанию)';
                            codeReader = new ZXing.BrowserMultiFormatReader();
                            codeReader.decodeFromStream(stream, videoElement, (result, error) => {
                                if (result) {
                                    console.log('Отсканировано:', result.getText());
                                    resultElement.textContent = `Отсканировано: ${result.getText()}`;
                                    tg.sendData(result.getText());
                                    tg.close();
                                }
                                if (error && !(error instanceof ZXing.NotFoundException)) {
                                    console.error(error);
                                }
                            });
                        };
                    } catch (fallbackError) {
                        console.error('Ошибка при попытке получить камеру по умолчанию:', fallbackError);
                        resultElement.textContent = `Ошибка: ${fallbackError.name} - ${fallbackError.message}`;
                        tg.showAlert(`Не удалось получить доступ даже к камере по умолчанию: ${fallbackError.message}`);
                    }
                }
            }
        }

        // Запускаем сканирование автоматически при загрузке страницы
        window.onload = startScanning;

        // Останавливаем камеру и сканирование при закрытии веб-приложения
        function stopStreaming() {
            if (stream) {
                console.log('Остановка потока камеры');
                stream.getTracks().forEach(track => track.stop());
                stream = null; // Очищаем ссылку
            }
            if (codeReader) {
                console.log('Сброс сканера');
                codeReader.reset();
                codeReader = null; // Очищаем ссылку
            }
        }

        tg.onEvent('mainButtonBackPressed', stopStreaming);
        tg.onEvent('viewportChanged', stopStreaming); // На всякий случай, может сработать при изменениях размера/ориентации
        window.addEventListener('beforeunload', stopStreaming);
        tg.onEvent('popupClosed', stopStreaming); // Добавляем обработку закрытия через Popup

    </script>
</body>
</html>
