<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR/Barcode Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }
        #scanner-container {
            width: 100%;
            max-width: 500px;
            position: relative;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid red;
        }
        #controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-size: 1.1em;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Сканер штрих-кодов и QR-кодов</h1>
        <div id="scanner-container">
            <video id="video" width="500" height="375" playsinline></video>
        </div>
        <div id="controls">
            <button id="switchCameraButton" disabled>Переключить камеру</button>
        </div>
        <div id="result">Инициализация...</div>
        <p id="version-info" style="font-size: 0.8em; color: var(--tg-theme-hint-color, #888); margin-top: 10px;">Версия: 0.03</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const videoElement = document.getElementById('video');
        const switchCameraButton = document.getElementById('switchCameraButton');
        const resultElement = document.getElementById('result');
        let codeReader;
        let stream;

        function stopStreaming() {
            if (stream) {
                console.log('Остановка потока камеры');
                stream.getTracks().forEach(track => track.stop());
                stream = null; // Очищаем ссылку
            }
            if (codeReader) {
                console.log('Сброс сканера');
                codeReader.reset();
                codeReader = null; // Очищаем ссылку
            }
            videoElement.srcObject = null; // Очищаем srcObject видеоэлемента
        }

        async function startScanning() {
            stopStreaming(); // Останавливаем предыдущий поток, если есть

            console.log('Начало функции startScanning');
            resultElement.textContent = 'Запрос доступа к камере...';

            try {
                console.log('Попытка запуска фронтальной камеры (facingMode: user)...');
                 const constraints = {
                    video: {
                        facingMode: 'user'
                    }
                };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                 console.log('Доступ к фронтальной камере получен');

            } catch (userError) {
                console.error('Не удалось запустить фронтальную камеру:', userError);
                resultElement.textContent = 'Фронтальная камера недоступна, пробуем любую доступную...';

                try {
                     console.log('Попытка запуска любой доступной камеры (video: true)...');
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                     console.log('Доступ к любой доступной камере получен');
                } catch (anyError) {
                    console.error('Не удалось получить доступ ни к одной камере:', anyError);
                    resultElement.textContent = `Ошибка: ${anyError.name} - ${anyError.message}. Камера недоступна.`;
                    tg.showAlert(`Не удалось получить доступ к камере: ${anyError.message}. Пожалуйста, проверьте разрешения.`);
                    switchCameraButton.disabled = true; 
                    console.log('Конец функции startScanning из catch');
                    return; // Останавливаем выполнение, если ни одна камера не доступна
                }
            }

            // Если поток получен (хотя бы от любой камеры как fallback)
            console.log('Доступ к камере получен, подготовка видеопотока...');
            resultElement.textContent = 'Доступ к камере получен, подготовка видеопотока...';

            if (!codeReader) {
                console.log('Инициализация ZXing.BrowserMultiFormatReader');
                codeReader = new ZXing.BrowserMultiFormatReader();
            }

            console.log('Установка videoElement.srcObject');
            videoElement.srcObject = stream;

            // Ждем загрузки данных видео
            videoElement.addEventListener('loadeddata', () => {
                 console.log('Данные видео загружены, попытка воспроизведения...');
                 videoElement.play();

                // Получаем информацию о камере (если доступно)
                const settings = stream.getVideoTracks()[0].getSettings();
                let cameraInfo = 'Камера';
                 // В этой упрощенной версии определяем по facingMode или считаем фронтальной, если facingMode user
                if (settings.facingMode === 'user') {
                     cameraInfo = 'Фронтальная камера';
                } else if (settings.facingMode === 'environment') {
                    cameraInfo = 'Задняя камера';
                } else if (settings.label) {
                    cameraInfo = settings.label; // Если facingMode нет, используем label
                }

                console.log(`Видео воспроизводится. Используется: ${cameraInfo}`);
                resultElement.textContent = `Наведите камеру на штрих-код или QR-код (${cameraInfo})`;

                console.log('Запуск декодирования из видеопотока');
                codeReader.decodeFromStream(stream, videoElement, (result, error) => {
                    if (result) {
                        console.log('Отсканировано успешно:', result.getText());
                        resultElement.textContent = `Отсканировано: ${result.getText()}`;
                        tg.sendData(result.getText());
                        tg.close();
                    }
                    if (error && !(error instanceof ZXing.NotFoundException)) {
                        console.error('Ошибка сканирования:', error);
                    }
                });
            }, { once: true });

             videoElement.onerror = (event) => {
                 console.error('Ошибка видеоэлемента:', event);
                 resultElement.textContent = 'Ошибка видеопотока.';
                 tg.showAlert('Ошибка видеопотока. Попробуйте перезагрузить страницу.');
             };


            console.log('Конец функции startScanning (после setup)');
        }

        // Запускаем сканирование при загрузке страницы с запросом фронтальной камеры
        window.onload = async () => {
             console.log('Начало window.onload');
            resultElement.textContent = 'Инициализация...';
            // Кнопка переключения камеры удалена из HTML, отключаем ее в JS на всякий случай
            switchCameraButton.disabled = true; 
            startScanning();
             console.log('Конец window.onload');
        };

        // Обработчик нажатия кнопки переключения камеры - удален
        // switchCameraButton.addEventListener('click', () => { ... });

        // Привязываем остановку потока к событиям закрытия веб-приложения
        function setupCleanupEvents() {
             console.log('Настройка обработчиков cleanup событий');
            tg.onEvent('mainButtonBackPressed', stopStreaming);
            tg.onEvent('viewportChanged', stopStreaming);
            window.addEventListener('beforeunload', stopStreaming);
            tg.onEvent('popupClosed', stopStreaming);
        }

        setupCleanupEvents();

    </script>
</body>
</html>
